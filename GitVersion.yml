mode: ContinuousDelivery
tag-prefix: v
next-version: 1.0.3
branches:
  stable:
    regex: ^stable$
    mode: ContinuousDelivery
    label: ''
    increment: Patch
  develop:
    regex: ^develop$
    mode: ContinuousDelivery
    label: ''
    increment: Patch
  release:
    regex: ^release[/-]
    mode: ContinuousDelivery
    label: rc
    increment: None
  feature:
    regex: ^feature[/-]
    label: alpha
    increment: Minor
  hotfix:
    regex: ^hotfix[/-]
    label: beta
    increment: Patch
ignore:
  sha: []
